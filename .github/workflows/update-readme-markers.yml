name: Update README markers

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  update:
    name: Update README markers
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6

      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Generate CLI help
        id: help
        run: |
          echo "content<<CLI_HELP_EOF" >> $GITHUB_OUTPUT
          cargo run -p k8swalski --quiet -- --help >> $GITHUB_OUTPUT
          echo "CLI_HELP_EOF" >> $GITHUB_OUTPUT
      
      - name: Update README
        uses: actions/github-script@v8
        env:
          CLI_HELP: ${{ steps.help.outputs.content }}
        with:
          script: |
            await require('./.github/scripts/inject-md-markers.js')({
              content: process.env.CLI_HELP,
              filePath: 'README.md',
              beginMarker: '<!-- BEGIN_CLI_HELP -->',
              endMarker: '<!-- END_CLI_HELP -->'
            })
      
      - name: Commit changes
        run: |
          git diff --exit-code README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update CLI help [skip ci]"
          git push
