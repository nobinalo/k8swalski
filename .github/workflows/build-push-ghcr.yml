name: Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  plan:
    name: Plan Workspace
    runs-on: ubuntu-latest
    outputs:
      bins:    ${{ steps.bins.outputs.bins }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: List Binaries
        id: bins
        run: |
          echo "bins=$(cargo metadata --no-deps --format-version 1 | jq -c '[.packages[] | select(any(.targets[]; .kind[] == "bin")) | .name]')" >> $GITHUB_OUTPUT

      - name: Set targets
        id: targets
        env:
          TARGETS: |
            [ {"id":"amd64", "triple":"x86_64-unknown-linux-musl",  "platform":"linux/amd64"}
            , {"id":"arm64", "triple":"aarch64-unknown-linux-musl",  "platform":"linux/arm64"}
            ]
        run: echo "targets=$TARGETS" >> $GITHUB_OUTPUT

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --all
      - name: Run clippy
        run: cargo clippy --all -- -D warnings

  build:
    name: Build ${{ matrix.bin }} (${{ matrix.target.id }})
    needs: [plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bin:    ${{ fromJson(needs.plan.outputs.bins) }}
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: mlugg/setup-zig@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.triple }}-${{ matrix.bin }}
          cache-targets: false

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Add Rust target
        run: rustup target add ${{ matrix.target.triple }}

      - name: Build binary
        run: cargo zigbuild --release --target ${{ matrix.target.triple }} -p ${{ matrix.bin }}

      - name: Compress binary (UPX)
        uses: crazy-max/ghaction-upx@v3
        with:
          files: target/${{ matrix.target.triple }}/release/${{ matrix.bin }}
          args: --best --lzma

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-${{ matrix.target.id }}
          path: target/${{ matrix.target.triple }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.bin }}
    needs: [plan, test, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bin: ${{ fromJson(needs.plan.outputs.bins) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.bin }}-*
          path: .

      - name: Compute platforms
        id: platforms
        run: |
          echo "list=$(echo '${{ needs.plan.outputs.targets }}' | jq -r '[.[].platform] | join(",")')" >> $GITHUB_OUTPUT

      - name: Generate Dockerfile
        uses: ./.github/actions/write-file
        with:
          path: ${{ runner.temp }}/Dockerfile
          contents: |
            FROM scratch
            ARG TARGETARCH
            COPY ${{ matrix.bin }}-${TARGETARCH}/${{ matrix.bin }} /${{ matrix.bin }}
            USER 65532:65532
            ENTRYPOINT ["/${{ matrix.bin }}"]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.bin }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          file: ${{ runner.temp }}/Dockerfile
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max