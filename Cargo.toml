[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
authors    = ["audacioustux <contact@audacioustux.com>"]
license    = "MIT"
repository = "https://github.com/nobinalo/k8swalski"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[workspace.lints.rust]
unsafe_code = "forbid"
unstable_features = "warn"

[workspace.lints.clippy]
# Build failures — clippy is highly confident about these
correctness = { level = "deny", priority = 1 }
suspicious  = { level = "deny", priority = 1 }
# Warnings — useful signal, not blocking
complexity  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
cargo       = { level = "warn", priority = -1 }
# Priority 0 overrides
unwrap_used             = "warn"   # panics kill the server process
expect_used             = "warn"   # prefer proper error propagation
wildcard_imports        = "warn"   # prefer explicit imports
module_name_repetitions = "allow"  # idiomatic in Rust
must_use_candidate      = "allow"  # too noisy on async handlers
missing_errors_doc      = "allow"  # anyhow errors don't need per-variant docs
multiple_crate_versions = "allow"  # transitive deps often bring multiple versions
